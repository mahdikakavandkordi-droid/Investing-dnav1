name: Deployed Preview Canary

on:
  push:
    branches:
      - codex/platform-v4-account-continuity
      - codex/visual-redesign-v1
      - codex/integration-product-risk-platform-v1
  workflow_dispatch:

jobs:
  preview-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - name: Confirm Chrome
        run: test -x /usr/bin/google-chrome
      - name: Wait for branch preview and run deployed flow
        env:
          CHROME_BIN: /usr/bin/google-chrome
          VERCEL_PREVIEW_SHARE_TOKEN: ${{ secrets.VERCEL_PREVIEW_SHARE_TOKEN }}
          PLATFORM_PREVIEW_ORIGIN: https://invasting-dna-agq7-git-codex-pla-e975cf-mahdikakavandkordi-9201.vercel.app
          VISUAL_PREVIEW_ORIGIN: https://invasting-dna-agq7-git-codex-vis-a45e9f-mahdikakavandkordi-9201.vercel.app
          INTEGRATION_PREVIEW_ORIGIN: https://invasting-dna-agq7-git-codex-int-648dcb-mahdikakavandkordi-9201.vercel.app
        run: |
          set -e
          if [ -z "${VERCEL_PREVIEW_SHARE_TOKEN}" ]; then
            echo "Missing VERCEL_PREVIEW_SHARE_TOKEN GitHub Actions secret"
            exit 2
          fi

          case "${GITHUB_REF_NAME}" in
            codex/visual-redesign-v1)
              TEST_ORIGIN="${VISUAL_PREVIEW_ORIGIN}"
              ;;
            codex/platform-v4-account-continuity)
              TEST_ORIGIN="${PLATFORM_PREVIEW_ORIGIN}"
              ;;
            codex/integration-product-risk-platform-v1)
              TEST_ORIGIN="${INTEGRATION_PREVIEW_ORIGIN}"
              ;;
            *)
              echo "No protected preview origin configured for ${GITHUB_REF_NAME}"
              exit 2
              ;;
          esac
          export TEST_ORIGIN

          echo "Waiting for protected preview endpoint: ${TEST_ORIGIN}"
          cookie_jar=/tmp/vercel-preview-cookies.txt
          for i in $(seq 1 30); do
            rm -f "${cookie_jar}"

            # Bootstrap Vercel's protected-preview share session without exposing
            # the token in repository code. The cookie jar is then reused for
            # the actual readiness request.
            curl -L -sS \
              -c "${cookie_jar}" \
              -b "${cookie_jar}" \
              --get \
              --data-urlencode "_vercel_share=${VERCEL_PREVIEW_SHARE_TOKEN}" \
              -o /tmp/share-bootstrap.html \
              "${TEST_ORIGIN}/" >/dev/null || true

            code=$(curl -L -sS \
              -c "${cookie_jar}" \
              -b "${cookie_jar}" \
              -o /tmp/preview.html \
              -w '%{http_code}' \
              "${TEST_ORIGIN}/dna/assessment" || true)

            if [ "$code" = "200" ]; then
              echo "Protected preview endpoint is responding"
              break
            fi

            echo "Attempt $i: HTTP ${code}"
            if [ "$i" = "30" ]; then
              echo "Protected preview never became reachable"
              exit 1
            fi
            sleep 4
          done

          node tests/run-deployed-preview-canary.cjs
