name: Daily market data refresh

on:
  schedule:
    # 01:30 UTC Tue-Sat = 20:30 EST / 21:30 EDT on the prior Mon-Fri market day.
    - cron: "30 1 * * 2-6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan only; do not fetch or write market data"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  refresh:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.MARKET_DATA_REFRESH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Invoke service-only market refresh worker
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY repository secret is required."
            exit 1
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN" = "true" ]; then
            BODY='{"dry_run":true,"trigger_source":"manual"}'
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            BODY='{"dry_run":false,"trigger_source":"manual"}'
          else
            BODY='{"dry_run":false,"trigger_source":"github_schedule"}'
          fi

          RESPONSE="$(curl -sS             -X POST             -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"             -H "apikey: $SUPABASE_SERVICE_ROLE_KEY"             -H "Content-Type: application/json"             --data "$BODY"             "https://bxjjannguzzzqsamnhem.supabase.co/functions/v1/market-data-refresh")"

          echo "$RESPONSE" | jq .

          STATUS="$(echo "$RESPONSE" | jq -r '.status // .error // "unknown"')"
          case "$STATUS" in
            completed|partial|no_work|dry_run)
              echo "Market refresh status: $STATUS"
              ;;
            *)
              echo "Market refresh is not operationally healthy: $STATUS"
              exit 2
              ;;
          esac
